name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-test-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jms
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/jms
      BETTER_AUTH_SECRET: ci-better-auth-secret-change-me-32chars
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      CRON_SECRET: ci-cron-secret
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Ensure Postgres roles (jms_tenant, service_role)
        run: pnpm --filter @nsd/jms exec prisma db execute --file prisma/ensure-vps-roles.sql --schema prisma/schema.prisma

      - name: Migrate database
        run: pnpm --filter @nsd/jms exec prisma migrate deploy

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test-build
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jms
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/jms
      BETTER_AUTH_SECRET: ci-better-auth-secret-change-me-32chars
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      CRON_SECRET: ci-cron-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Ensure Postgres roles (jms_tenant, service_role)
        run: pnpm --filter @nsd/jms exec prisma db execute --file prisma/ensure-vps-roles.sql --schema prisma/schema.prisma
      - name: Migrate database
        run: pnpm --filter @nsd/jms exec prisma migrate deploy
      - name: Install Playwright Chromium
        run: pnpm --filter @nsd/jms exec playwright install --with-deps chromium
      - name: E2E smoke (platform home + health)
        run: pnpm --filter @nsd/jms exec playwright test --project=ci-smoke
        # workers: 1 is set in playwright.config.ts
